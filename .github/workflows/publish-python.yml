name: Publish Python package
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: publish-python
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Require a license decision before public release
        run: |
          python - <<'PY'
          import pathlib, tomllib
          project = tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']
          if not project.get('license'):
              raise SystemExit('Choose and record the package license before publishing; see RELEASING.md')
          PY
      - run: PYTHONPATH=src python -m unittest discover -s tests -v
      - run: python -m pip install build==1.2.2.post1 twine==6.1.0
      - run: python -m build && python -m twine check --strict dist/*
      - name: Verify installed distribution
        run: |
          python -m venv "$RUNNER_TEMP/sprigrun-smoke"
          "$RUNNER_TEMP/sprigrun-smoke/bin/python" -m pip install --no-deps dist/*.whl
          cd "$RUNNER_TEMP"
          test "$("$RUNNER_TEMP/sprigrun-smoke/bin/sprigrun" eval '1 + 2')" = '3'
          "$RUNNER_TEMP/sprigrun-smoke/bin/python" -m sprigrun --version
          "$RUNNER_TEMP/sprigrun-smoke/bin/python" -c 'import importlib.metadata, sprigrun; assert importlib.metadata.version("sprigrun") == sprigrun.__version__'
          "$RUNNER_TEMP/sprigrun-smoke/bin/python" -m unittest discover -s "$GITHUB_WORKSPACE/python/tests" -v
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-dist
          path: python/dist/*
          if-no-files-found: error
  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/sprigrun
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: python-dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # v1.14.0
